<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>竞品映射标杆配置原型</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #d8dee8;
      --line-strong: #b8c2d2;
      --text: #172033;
      --muted: #637083;
      --muted-2: #8a96a8;
      --primary: #0f5c8c;
      --primary-strong: #09496f;
      --primary-soft: #e6f2f8;
      --success: #16734c;
      --success-soft: #e8f6ef;
      --warning: #9a5b13;
      --warning-soft: #fff3dd;
      --danger: #aa2e25;
      --danger-soft: #fdecea;
      --shadow: 0 12px 30px rgba(17, 30, 48, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1180px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px 1fr;
    }

    .sidebar {
      background: #111827;
      color: #e5e7eb;
      padding: 22px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      font-weight: 700;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      font-weight: 800;
    }

    .nav-section {
      margin-top: 18px;
    }

    .nav-title {
      margin: 0 0 8px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-item {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-radius: 7px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .nav-item.active {
      background: #243247;
      color: #ffffff;
      font-weight: 700;
    }

    .main {
      min-width: 0;
      padding: 24px 28px 32px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--primary-strong);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 338px;
      gap: 18px;
      align-items: start;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .filters {
      margin-bottom: 14px;
      padding: 14px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr .9fr 108px;
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      height: 36px;
      margin-top: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      padding: 0 10px;
      font-size: 13px;
    }

    .table-shell {
      overflow: hidden;
    }

    .table-toolbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding: 0 14px;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 800;
    }

    .toolbar-meta {
      color: var(--muted);
      font-size: 12px;
    }

    table {
      width: 100%;
      min-width: 940px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 12px 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    tbody tr {
      height: 72px;
    }

    tbody tr:hover {
      background: #fbfcfe;
    }

    .col-brand {
      width: 160px;
    }

    .col-series {
      width: 188px;
    }

    .col-target {
      width: 188px;
    }

    .col-sku {
      width: 118px;
    }

    .col-status {
      width: 134px;
    }

    .col-action {
      width: 176px;
    }

    .name-main {
      font-weight: 800;
    }

    .name-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      min-width: 88px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.benchmark {
      background: var(--success-soft);
      color: var(--success);
    }

    .pill.mapped {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .pill.missing {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .inline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-btn {
      min-width: 76px;
      height: 30px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--primary);
      padding: 0 8px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .text-btn:hover {
      border-color: var(--line);
      background: var(--panel-soft);
    }

    .text-btn.danger {
      color: var(--danger);
    }

    .text-btn.current {
      min-width: 74px;
      background: var(--success-soft);
      color: var(--success);
    }

    .preview {
      position: sticky;
      top: 24px;
      overflow: hidden;
    }

    .preview-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .preview-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .preview-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .preview-body {
      padding: 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-soft);
      padding: 10px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .metric-value {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .benchmark-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      padding: 13px;
    }

    .benchmark-card.empty {
      border-style: dashed;
      background: var(--panel-soft);
    }

    .card-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .card-title {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 850;
    }

    .card-detail {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .report-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding: 12px 0;
      font-size: 12px;
    }

    .report-row:first-of-type {
      margin-top: 14px;
    }

    .report-row span:first-child {
      color: var(--muted);
      font-weight: 700;
    }

    .report-row span:last-child {
      font-weight: 800;
      text-align: right;
    }

    .empty-row {
      height: 180px;
      text-align: center;
      color: var(--muted);
    }

    .empty-row strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      right: 28px;
      bottom: 24px;
      width: 320px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      padding: 12px 14px;
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 1240px) {
      body {
        min-width: 1080px;
      }

      .shell {
        grid-template-columns: 208px 1fr;
      }

      .layout {
        grid-template-columns: minmax(0, 1fr) 318px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark">MK</div>
        <div>Makuku MI</div>
      </div>
      <section class="nav-section">
        <p class="nav-title">Price 1.0</p>
        <div class="nav-item">价格看板</div>
        <div class="nav-item">价格事实</div>
        <div class="nav-item active">竞品映射</div>
        <div class="nav-item">竞品主数据</div>
      </section>
      <section class="nav-section">
        <p class="nav-title">Workflow</p>
        <div class="nav-item">门店走查</div>
        <div class="nav-item">AI 复核</div>
        <div class="nav-item">行动建议</div>
      </section>
    </aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>竞品映射</h1>
          <p class="subtitle">默认市场标杆作为映射规则的一项轻量配置，报表按当前选择读取。</p>
        </div>
        <div class="head-actions">
          <button class="btn" type="button" id="clearAllBtn">清空当前系列标杆</button>
          <button class="btn primary" type="button">保存映射规则</button>
        </div>
      </header>

      <section class="section filters" aria-label="筛选">
        <div class="filter-grid">
          <label>
            Makuku 系列
            <select id="seriesFilter">
              <option value="all">全部系列</option>
            </select>
          </label>
          <label>
            竞品品牌
            <select id="brandFilter">
              <option value="all">全部品牌</option>
            </select>
          </label>
          <label>
            映射状态
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="benchmark">默认标杆</option>
              <option value="mapped">已映射</option>
              <option value="missing">待补齐</option>
            </select>
          </label>
          <button class="btn" type="button" id="resetBtn">重置</button>
        </div>
      </section>

      <div class="layout">
        <section class="section table-shell" aria-label="竞品映射列表">
          <div class="table-toolbar">
            <div class="toolbar-title">系列映射规则</div>
            <div class="toolbar-meta" id="resultMeta"></div>
          </div>
          <table>
            <thead>
              <tr>
                <th class="col-brand">竞品品牌</th>
                <th class="col-series">竞品系列</th>
                <th class="col-target">目标 Makuku 系列</th>
                <th class="col-sku">覆盖 SKU</th>
                <th class="col-status">当前状态</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>
            <tbody id="mappingRows"></tbody>
          </table>
        </section>

        <aside class="section preview" aria-label="报表预览">
          <div class="preview-head">
            <h2 class="preview-title">报表标杆预览</h2>
            <p class="preview-subtitle" id="previewScope">当前筛选：全部系列</p>
          </div>
          <div class="preview-body">
            <div class="metric-grid">
              <div class="metric">
                <div class="metric-label">映射规则</div>
                <div class="metric-value" id="metricRules">0</div>
              </div>
              <div class="metric">
                <div class="metric-label">覆盖 SKU</div>
                <div class="metric-value" id="metricSkus">0</div>
              </div>
            </div>

            <div id="benchmarkPreview"></div>

            <div class="report-row">
              <span>价格系数口径</span>
              <span id="coefficientMode">默认标杆均价</span>
            </div>
            <div class="report-row">
              <span>样本过滤</span>
              <span id="sampleMode">按报表区域和周期</span>
            </div>
            <div class="report-row">
              <span>配置归属</span>
              <span>竞品映射规则</span>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const mappings = [
      {
        id: "mamy-poko-royal-soft",
        brand: "MamyPoko",
        competitorSeries: "Royal Soft",
        targetSeries: "Slim",
        skuCount: 12,
        mappedCount: 12,
        sampleCount: 84,
        avgPrice: 2345,
        isBenchmark: true
      },
      {
        id: "pampers-premium-care",
        brand: "Pampers",
        competitorSeries: "Premium Care",
        targetSeries: "Slim",
        skuCount: 10,
        mappedCount: 10,
        sampleCount: 62,
        avgPrice: 2490,
        isBenchmark: false
      },
      {
        id: "sweety-silver-pants",
        brand: "Sweety",
        competitorSeries: "Silver Pants",
        targetSeries: "Slim",
        skuCount: 8,
        mappedCount: 7,
        sampleCount: 39,
        avgPrice: 2188,
        isBenchmark: false
      },
      {
        id: "merries-good-skin",
        brand: "Merries",
        competitorSeries: "Good Skin",
        targetSeries: "Air Diapers",
        skuCount: 9,
        mappedCount: 9,
        sampleCount: 57,
        avgPrice: 2680,
        isBenchmark: true
      },
      {
        id: "mamamia-soft-dry",
        brand: "MamaMia",
        competitorSeries: "Soft Dry",
        targetSeries: "Air Diapers",
        skuCount: 7,
        mappedCount: 6,
        sampleCount: 22,
        avgPrice: 2058,
        isBenchmark: false
      },
      {
        id: "pampers-baby-dry",
        brand: "Pampers",
        competitorSeries: "Baby Dry",
        targetSeries: "Comfort",
        skuCount: 11,
        mappedCount: 11,
        sampleCount: 71,
        avgPrice: 1996,
        isBenchmark: true
      },
      {
        id: "sweety-gold",
        brand: "Sweety",
        competitorSeries: "Gold",
        targetSeries: "Comfort",
        skuCount: 6,
        mappedCount: 4,
        sampleCount: 18,
        avgPrice: 1880,
        isBenchmark: false
      }
    ];

    const state = {
      series: "all",
      brand: "all",
      status: "all"
    };

    const seriesFilter = document.getElementById("seriesFilter");
    const brandFilter = document.getElementById("brandFilter");
    const statusFilter = document.getElementById("statusFilter");
    const mappingRows = document.getElementById("mappingRows");
    const resultMeta = document.getElementById("resultMeta");
    const previewScope = document.getElementById("previewScope");
    const benchmarkPreview = document.getElementById("benchmarkPreview");
    const metricRules = document.getElementById("metricRules");
    const metricSkus = document.getElementById("metricSkus");
    const coefficientMode = document.getElementById("coefficientMode");
    const toast = document.getElementById("toast");

    function initFilters() {
      uniqueValues("targetSeries").forEach((value) => {
        seriesFilter.appendChild(option(value, value));
      });
      uniqueValues("brand").forEach((value) => {
        brandFilter.appendChild(option(value, value));
      });
    }

    function option(value, label) {
      const item = document.createElement("option");
      item.value = value;
      item.textContent = label;
      return item;
    }

    function uniqueValues(key) {
      return Array.from(new Set(mappings.map((item) => item[key]))).sort((left, right) => left.localeCompare(right));
    }

    function visibleMappings() {
      return mappings.filter((item) => {
        if (state.series !== "all" && item.targetSeries !== state.series) return false;
        if (state.brand !== "all" && item.brand !== state.brand) return false;
        if (state.status === "benchmark" && !item.isBenchmark) return false;
        if (state.status === "mapped" && (item.isBenchmark || item.mappedCount < item.skuCount)) return false;
        if (state.status === "missing" && item.mappedCount >= item.skuCount) return false;
        return true;
      });
    }

    function render() {
      const rows = visibleMappings();
      resultMeta.textContent = `${rows.length} 条规则`;
      mappingRows.innerHTML = "";

      if (rows.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td class="empty-row" colspan="6"><strong>没有符合条件的映射</strong>调整筛选后可继续查看标杆配置。</td>';
        mappingRows.appendChild(tr);
      } else {
        rows.forEach((item) => mappingRows.appendChild(rowFor(item)));
      }

      renderPreview(rows);
    }

    function rowFor(item) {
      const tr = document.createElement("tr");
      const statusClass = item.isBenchmark ? "benchmark" : item.mappedCount >= item.skuCount ? "mapped" : "missing";
      const statusText = item.isBenchmark ? "默认标杆" : item.mappedCount >= item.skuCount ? "已映射" : "待补齐";
      const action = item.isBenchmark
        ? `<button class="text-btn current" type="button" data-action="noop" data-id="${item.id}">已是标杆</button><button class="text-btn danger" type="button" data-action="unset" data-id="${item.id}">取消标杆</button>`
        : `<button class="text-btn" type="button" data-action="set" data-id="${item.id}">设为标杆</button>`;

      tr.innerHTML = `
        <td>
          <div class="name-main">${item.brand}</div>
          <div class="name-sub">竞品品牌</div>
        </td>
        <td>
          <div class="name-main">${item.competitorSeries}</div>
          <div class="name-sub">样本 ${item.sampleCount} 条</div>
        </td>
        <td>
          <div class="name-main">${item.targetSeries}</div>
          <div class="name-sub">Makuku 系列</div>
        </td>
        <td>${item.mappedCount}/${item.skuCount}</td>
        <td><span class="pill ${statusClass}">${statusText}</span></td>
        <td><div class="inline-actions">${action}</div></td>
      `;
      return tr;
    }

    function renderPreview(rows) {
      const scopedRows = state.series === "all"
        ? rows
        : mappings.filter((item) => item.targetSeries === state.series);
      const relevantRows = state.series === "all" ? rows : scopedRows;
      const skuTotal = relevantRows.reduce((sum, item) => sum + item.mappedCount, 0);
      const benchmark = pickBenchmarkForPreview(relevantRows);
      const scopeLabel = state.series === "all" ? "全部系列" : state.series;

      previewScope.textContent = `当前筛选：${scopeLabel}`;
      metricRules.textContent = String(relevantRows.length);
      metricSkus.textContent = String(skuTotal);

      if (!benchmark) {
        benchmarkPreview.innerHTML = `
          <div class="benchmark-card empty">
            <div class="card-label">当前默认标杆</div>
            <div class="card-title">未指定</div>
            <div class="card-detail">报表将使用全部映射竞品均值，或在左侧指定默认标杆。</div>
          </div>
        `;
        coefficientMode.textContent = "全部映射竞品均值";
        return;
      }

      benchmarkPreview.innerHTML = `
        <div class="benchmark-card">
          <div class="card-label">当前默认标杆</div>
          <div class="card-title">${benchmark.brand} ${benchmark.competitorSeries}</div>
          <div class="card-detail">
            对应 ${benchmark.targetSeries}，覆盖 ${benchmark.mappedCount}/${benchmark.skuCount} 个 SKU，最近周期均价 IDR ${formatNumber(benchmark.avgPrice)} / piece。
          </div>
        </div>
      `;
      coefficientMode.textContent = "默认标杆均价";
    }

    function pickBenchmarkForPreview(rows) {
      if (state.series !== "all") return rows.find((item) => item.isBenchmark) || null;
      return rows.find((item) => item.isBenchmark) || null;
    }

    function setBenchmark(id) {
      const selected = mappings.find((item) => item.id === id);
      if (!selected) return;
      mappings.forEach((item) => {
        if (item.targetSeries === selected.targetSeries) item.isBenchmark = item.id === selected.id;
      });
      showToast(`${selected.targetSeries} 已切换为 ${selected.brand} ${selected.competitorSeries}`);
      render();
    }

    function unsetBenchmark(id) {
      const selected = mappings.find((item) => item.id === id);
      if (!selected) return;
      selected.isBenchmark = false;
      showToast(`${selected.targetSeries} 当前没有默认标杆`);
      render();
    }

    function clearCurrentSeriesBenchmark() {
      const targetSeries = state.series;
      const affected = mappings.filter((item) => targetSeries === "all" ? item.isBenchmark : item.targetSeries === targetSeries && item.isBenchmark);
      affected.forEach((item) => {
        item.isBenchmark = false;
      });
      showToast(targetSeries === "all" ? "已清空全部默认标杆" : `${targetSeries} 已清空默认标杆`);
      render();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("id-ID").format(value);
    }

    mappingRows.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const id = button.dataset.id;
      if (action === "set") setBenchmark(id);
      if (action === "unset") unsetBenchmark(id);
    });

    seriesFilter.addEventListener("change", () => {
      state.series = seriesFilter.value;
      render();
    });

    brandFilter.addEventListener("change", () => {
      state.brand = brandFilter.value;
      render();
    });

    statusFilter.addEventListener("change", () => {
      state.status = statusFilter.value;
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state.series = "all";
      state.brand = "all";
      state.status = "all";
      seriesFilter.value = "all";
      brandFilter.value = "all";
      statusFilter.value = "all";
      render();
    });

    document.getElementById("clearAllBtn").addEventListener("click", clearCurrentSeriesBenchmark);

    initFilters();
    render();
  </script>
</body>
</html>
